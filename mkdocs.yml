      - "Level 0: First Steps":
          - chapters/00-first-steps/index.md
          - What is Linux?: chapters/00-first-steps/01-what-is-linux.md
          - The terminal, shell, and prompt: chapters/00-first-steps/02-terminal-shell-prompt.md
